<div class="form-container">
    <h2 style = "margin:auto" >Task 2. Bootstrap Validation Styles</h2>

    <form class="was-validated">
    <div class="row">
        <div class="col-md-6 mb-3">
            <label for="fname" class="form-label">Name:</label>
            <input type="text" class="form-control" id="fname" minlength="3" maxlength="20" required>
            <div class="valid-feedback">Looks good!</div>
            <div class="invalid-feedback">Please enter a valid name (3-20 characters)</div>
        </div>
        <div class="col-md-6 mb-3">
            <label for="email" class="form-label">Email:</label>
            <input type="email" class="form-control" id="email" required>
            <div class="valid-feedback">Looks good!</div>
            <div class="invalid-feedback">Email is required and must be valid</div>
        </div>
    </div>

    <div class="mb-3">
        <label for="message" class="form-label">Message:</label>
        <textarea class="form-control" id="message" rows="5" required></textarea>
        <div class="valid-feedback">Looks good!</div>
        <div class="invalid-feedback">Message cannot be empty</div>
    </div>

    <button type="submit" class="btn btn-primary">Submit</button>
    <button type="reset" class="btn btn-secondary">Reset</button>
</form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
